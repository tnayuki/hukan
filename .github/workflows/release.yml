name: Release

# A push of a `v*` tag builds the ad-hoc-signed app, publishes it as that tag's GitHub Release
# and points the cask in tnayuki/homebrew-hukan at it. Every push to main lints, tests and builds
# the same way and publishes nothing, so a tree that would not ship is caught before anything is
# tagged.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # The runner is pinned to the macOS 26 image for its SDK: AppKit gives a window the
    # appearance and behaviour the SDK it was linked against knows, so a build against the 15
    # SDK wears the old toolbar, sidebar and controls on a macOS 26 desk. README's "macOS 15"
    # is the deployment target — the floor the app runs on — not the SDK it is built with;
    # pinning the runner to that was the mistake.
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint
        # The same gate as the pre-commit hook, over the whole tree rather than the staged blobs;
        # swift-format is Xcode's own, so nothing is installed.
        run: xcrun swift-format lint --strict -p -r Sources Tests

      - name: Runner display settings
        # Five things the image ships that are the display's opinion rather than hukan's, each
        # measured to move a reference: Reduce Transparency is on, which is what an
        # `NSVisualEffectView` and every semantic system fill read; no preferred language is
        # Japanese, so CoreText's CJK fallback lands on PingFang SC and a kanji comes out in
        # Chinese glyph forms at Chinese advances; and scroll bars are always shown, which
        # narrows every scroll view's content until a summary truncates a word early. And the
        # display opens at 1024x768, which is narrower than the window the reader tests open —
        # AppKit constrains a frame to the screen, so they measured a column they were not
        # written against. It advertises modes up to 1920x1080, so `ci-display.swift` asks for
        # the widest. That is the whole of what raising a resolution can buy: the *scale* stays
        # 1, and no advertised mode carries another. Reduce Motion is on as well, so a window
        # asked to resize animated did it instantly — which is not the thing the reader test
        # named in its own title.
        run: |
          defaults write com.apple.universalaccess reduceTransparency -bool false
          defaults write -g AppleLanguages -array ja en
          defaults write -g AppleShowScrollBars -string WhenScrolling
          defaults write com.apple.universalaccess reduceMotion -bool false
          xcrun swiftc -O .github/ci-display.swift -o "$RUNNER_TEMP/display"
          "$RUNNER_TEMP/display"

      - name: Test
        # Most of the pixel-pinned tests run here now: they render through `SnapshotSurface`,
        # which pins the backing scale, the colour space and the completion panel's material, so
        # a reference no longer describes the display that recorded it. What is still skipped is
        # what the runner's *screen* decides rather than the drawing — AppKit rounds a control's
        # intrinsic size to the screen's backing grid and not to the window's, so a browser
        # button is 13.5pt wide here and 14pt there and everything after it sits a device pixel
        # over. See the snapshot note in CLAUDE.md; a tolerance is the one answer that comparison
        # refuses.
        #
        # The suite runs parallel (see CLAUDE.md), so a failure's file, line and message are in
        # the .xcresult and not on stdout; the summary below is what reads them back.
        run: |
          set +e
          xcodebuild test -project hukan.xcodeproj -scheme Hukan \
            -derivedDataPath .build/DerivedData -skipPackagePluginValidation \
            -skip-testing:HukanAppTests/CommitSnapshotTests \
            -skip-testing:HukanAppTests/HistorySnapshotTests \
            -skip-testing:HukanAppTests/BrowserSnapshotTests \
            -skip-testing:HukanAppTests/CardSnapshotTests/testExitPlanApprovalCard \
            > xcodebuild-test.log 2>&1
          status=$?
          R=$(ls -td .build/DerivedData/Logs/Test/*.xcresult 2>/dev/null | head -1)
          if [ -n "$R" ]; then
            xcrun xcresulttool get test-results summary --path "$R" | jq -r \
              '"\(.result): \(.passedTests) passed, \(.failedTests) failed", (.testFailures[]? | "  \(.testIdentifierString)\n    \(.failureText)")'
          else
            tail -40 xcodebuild-test.log
          fi
          exit $status

      - name: Build .app
        # hukan.xcodeproj is the only build system; signing is ad-hoc (`-`). Gatekeeper
        # quarantine is stripped by the cask's postflight on the user's machine.
        # -skipPackagePluginValidation pre-trusts SwiftTerm's build-tool plugin (see the Build
        # note): plugin trust is per-user and uncommittable, so a headless runner must skip it or
        # the build fails at plug-in validation.
        run: |
          xcodebuild build -project hukan.xcodeproj -scheme Hukan -configuration Release \
            -derivedDataPath .build/DerivedData -skipPackagePluginValidation

      - name: Zip the bundle
        run: |
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            ".build/DerivedData/Build/Products/Release/Hukan.app" \
            "Hukan.zip"

      - name: Publish the tag's Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: Hukan.zip

      - name: Point the cask at the tag
        # The tap's cask names the version and the zip's sha256, and both are known here: the
        # archive built two steps up is the one the Release just published, so the hash is read
        # off it rather than downloaded back. Auth is the `hukan-release-bot` deploy key, whose
        # public half is registered read-write on the tap and nowhere else — narrower than a PAT,
        # which would carry an account's whole reach into this runner. A re-run of an already
        # released tag finds the cask saying what it would write and pushes nothing.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          sha="$(shasum -a 256 Hukan.zip | cut -d' ' -f1)"

          key="$RUNNER_TEMP/tap_deploy_key"
          umask 077
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          git clone --depth 1 git@github.com:tnayuki/homebrew-hukan.git "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          # Anchored on the field names, not on the values they hold, so the edit does not need
          # to know what the last release was.
          /usr/bin/sed -i '' \
            -e "s|^  version \".*\"$|  version \"$version\"|" \
            -e "s|^  sha256 \".*\"$|  sha256 \"$sha\"|" \
            Casks/hukan.rb
          if git diff --quiet; then
            echo "The cask already names $version; nothing to push."
            exit 0
          fi
          git -c user.name='hukan-release-bot' \
              -c user.email='hukan-release-bot@users.noreply.github.com' \
              commit -am "Point the cask at $version"
          git push origin HEAD:main
